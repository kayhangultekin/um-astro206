# ASTRO 206 (Black Holes) — lecture notes.
#
# `render:` names pages explicitly. A Quarto project otherwise renders every
# .qmd it can find, which would build the include fragments under
# for_students/ as if they were standalone pages.

project:
  type: website
  output-dir: _site
  preview:
    port: 4321
  render:
    - index.qmd
    - lectures/scales-and-schwarzschild/index.qmd
    - lectures/spinning-bhs-and-tidal/index.qmd
    - lectures/special-relativity/index.qmd
    - lectures/general-relativity/index.qmd
    - lectures/strong-gravity/index.qmd
  # No `resources:` entry for fonts/ is needed. Quarto follows the url()
  # references in the theme SCSS and copies those files next to the compiled
  # CSS itself. Adding fonts/ here published a SECOND copy at _site/fonts/,
  # including the four .otf files that exist only so matplotlib can draw
  # figure labels at build time and have no business being served.

# Navbar on top, one rail. The lecture pages set `toc-location: left`, and the
# TOC occupies the SIDEBAR slot itself -- the left element on a lecture page is
# `<nav id="quarto-sidebar" class="sidebar ... sidebar-navigation">` wrapping
# `<nav id="TOC">`. So there is no free left rail for site navigation, and a
# site sidebar would compete with the table of contents. Everything visual
# lives in quarto-lecnotes.scss; this block is structure only.
website:
  title: "ASTRO 206 · Black Holes"
  navbar:
    # Always visible. Quarto's default header is `headroom fixed-top` plus
    # headroom.min.js, which slides the bar away on scroll-down; `pinned` makes
    # Quarto omit the SCRIPT (the class stays and is inert). The tell that this
    # is working is the absence of headroom.min.js -- not the absence of the
    # class. Costs 60.5px permanently: 7.4% of a 900px viewport.
    pinned: true
    search: true
    # No `background:` here on purpose. It does NOT do what it looks like it
    # does: Quarto emits `data-bs-theme="dark"` on the <nav> unconditionally,
    # so the color is set in the SCSS by overriding Bootstrap's dark navbar
    # variables. Setting `background:` as well would just add a second, losing
    # source of truth. Verified: both a hex and the named `light` left the
    # attribute at "dark".
    left:
      # No Home item -- the brand links to index.html already.
      #
      # A dropdown from the start, even at one lecture, so the nav's shape does
      # not change under students mid-semester as more are converted. Order is
      # TEACHING order, mirroring for_me/lecNN; gaps are expected and fine,
      # because some lectures are Keynote-based and deliberately never
      # converted. Unconverted lectures do not appear at all: those students are
      # pointed at Canvas, which is not on the open web.
      #
      # At ~25 lectures this menu can be grouped without a plugin: an entry with
      # `text:` and no `href:` renders as <li class="dropdown-header">, and
      # `text: "---"` renders as <hr class="dropdown-divider">.
      - text: "Lectures"
        menu:
          - href: lectures/scales-and-schwarzschild/index.qmd
            text: "Scales and the Schwarzschild radius"
          - href: lectures/spinning-bhs-and-tidal/index.qmd
            text: "Spinning black holes and tidal forces"
          - href: lectures/special-relativity/index.qmd
            text: "Special relativity"
          - href: lectures/general-relativity/index.qmd
            text: "General relativity"
          - href: lectures/strong-gravity/index.qmd
            text: "Strong gravity"

format:
  live-html:
    # NEVER remove this. Quarto otherwise renders an "Other Formats -> PDF"
    # link into every page, and the PDF is the blackboard build: it contains
    # every "Ask yourself" answer, and in an instructor build the in-class
    # problems too. One click on a published page would hand students the
    # answer key. Publishing must also render HTML only (see the CI workflow),
    # so the file is not sitting there for a guessed URL either.
    format-links: false
    # marks.scss is GENERATED (../typography_specimens/emit_marks.py) and
    # carries the $marks map of callout glyph outlines. It must come BEFORE
    # the theme, which consumes $marks in its rules.
    # marks.scss and tab-marks.scss are GENERATED (see typography_specimens/)
    # and must precede the theme, which reads $marks and $tab-marks.
    theme: [default, marks.scss, tab-marks.scss, quarto-lecnotes.scss]
    # Quarto 1.10.18 loads MathJax *4*, whose math font is selectable (11 of
    # them); the default is mathjax-newcm. Termes is chosen because it typesets
    # best here -- in the other fonts the "s" of \mathrm{cm\,s^{-1}} drops
    # below the baseline next to the exponent.
    #
    # `output.font` is GLOBAL: one math font per document. This must run
    # before MathJax, which it does -- Quarto's own <script> carries `defer`,
    # so it executes only after parsing, and any inline script beats it.
    include-in-header:
      - text: |
          <script>window.MathJax = { output: { font: 'mathjax-termes' } };</script>
    toc: true
    toc-depth: 3
    toc-location: left
    toc-title: "On this page"
    number-sections: true
    number-depth: 2
    # `reference-section-title:` is deliberately NOT set here. It is a PANDOC
    # option, and Quarto supersedes it -- setting both makes two layers each
    # try to supply the heading. Measured at each layer separately:
    #
    #   pandoc alone, WITHOUT it   ->  a bare <div id="refs">, NO heading
    #   pandoc alone, WITH it      ->  <section id="bibliography">
    #                                    <h1 class="unnumbered">References</h1>
    #                                    <div id="refs"> ... </div>
    #                                  -- complete and correct on its own
    #
    # Then Quarto's APPENDIX pass runs on top of pandoc's output. It harvests
    # the #refs div and the heading text, re-emits them inside #quarto-appendix
    # as an <h2 class="quarto-appendix-heading">, and does NOT remove the now
    # empty <section id="bibliography"> pandoc left. The TOC is built from the
    # document's section structure, so it indexes that empty husk.
    #
    # So the heading you see always comes from Quarto, never from this key.
    # With citeproc on, Quarto routes the reference list into its APPENDIX
    # machinery by itself:
    #
    #   <div id="quarto-appendix">
    #     <section role="doc-bibliography" id="quarto-bibliography">
    #       <h2 class="quarto-appendix-heading">References</h2>
    #       <div id="refs" class="csl-bib-body hanging-indent">
    #
    # So the heading already exists, already reads "References", and is already
    # exempt from section numbering -- `number-sections: true` does NOT number
    # it, so there is no "11 References" to suppress. Verified both ways by
    # render, not inferred.
    #
    # The cost of leaving the key out is that there is NO TOC entry for
    # References.
    # That is Quarto's designed behavior for appendices and is accepted for
    # now. If a real "Further reading" section is ever wanted, the right shape
    # is an explicit `## References` heading plus an empty `::: {#refs} :::`
    # in the document -- a real section, a correct anchor, and somewhere for
    # prose to live. That is content, so it is Kayhan's call, not a default.
    html-math-method: mathjax
    fig-align: center
    fig-width: 6.5
    fig-height: 4.0
    fig-dpi: 115
    code-fold: true
    code-summary: "Show the Python"
    code-tools:
      source: false
      toggle: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    grid:
      margin-width: 320px
  pdf:
    documentclass: scrartcl
    papersize: letter
    # Body size, for reading at the blackboard. Kayhan wears reading glasses.
    #
    # An earlier attempt scaled the MATH font alone (Scale= on \setmathfont).
    # He rejected it on sight, and the reason generalizes: "I don't like how
    # text and in-line math are different sizes. That *reduces* readability. If
    # the text words are important enough for me to read, then we should
    # increase their size as well." So the knob is the document base size and
    # the math follows it -- verified equal, page by page, in the specimen.
    #
    # KOMA takes an arbitrary `fontsize=`; standard classes only do 10/11/12pt.
    # 13.75pt requested lands at 13.70pt painted (LaTeX rounds to its internal
    # size), which is what the measurements below are against.
    #
    # NOTE: `-M classoption:...` on the command line is a SILENT NO-OP here --
    # it reports success and leaves the body at 10.91pt. Change this key, or
    # measure the painted size, or you will compare three identical documents.
    classoption:
      - fontsize=13.75pt
    # Margins WIDENED, not narrowed. Narrow margins were considered and
    # rejected: "All of the actions we are taking are to help readability for
    # me, personally, while at the blackboard. Small margins hurts that."
    #
    # Sized to a 65-character measure, which is the classic optimum and his
    # explicit target. At 13.70pt the real average character width is 5.94pt
    # (0.4333 em), so 65 characters needs a 386pt block -> 1.57in sides.
    # Verified by rasterising the render and counting characters on the 231
    # full justified prose lines: median exactly 65.0.
    #
    # Do NOT compute this from a font's mean a-z advance. That proxy ignores
    # spaces and weights rare wide letters equally, and it read 13% narrow --
    # it put the baseline document at 87.5 chars/line when the true figure is
    # 99.0, which would have set this margin at 1.22in and missed the target by
    # eight characters.
    #
    # Only the SIDES move. Top and bottom stay at 1in: the target is line
    # length, and shrinking the vertical would only cost pages.
    geometry:
      - left=1.57in
      - right=1.57in
      - top=1in
      - bottom=1in
    # Typography, matching the HTML. Until 2026-08-15 this PDF was stock Latin
    # Modern -- Computer Modern's lineage, the family Kayhan is on record
    # disliking -- while the HTML had been moved to XCharter/EB Garamond.
    #
    # The engine is LuaTeX, so pandoc's template already loads fontspec and
    # unicode-math (the old Latin Modern Math was unicode-math's DEFAULT, not a
    # choice). Setting these variables is therefore the whole job.
    #
    # Why this is the first lever for equation readability: XCharter's x-height
    # is 0.481 em against Latin Modern's 0.431 em, so at the SAME 11pt it reads
    # 11.6% larger -- Latin Modern would need 12.28pt to match it. The cost in
    # width is +0.3% mean lowercase advance, i.e. no page-count change.
    #
    # XCharter has BOTH an Italic and a Slanted; a bare family lookup can pick
    # the wrong one, so the four faces are named explicitly.
    mainfont: XCharter
    mainfontoptions:
      - "UprightFont=*-Roman"
      - "ItalicFont=*-Italic"
      - "BoldFont=*-Bold"
      - "BoldItalicFont=*-BoldItalic"
    # XCharter-Math.otf ships in TeX Live 2025 (3111 glyphs, real MATH table),
    # so the PDF -- unlike the web, where MathJax 4 can only use its own eleven
    # packaged fonts -- can set text and math in the SAME typeface. Verified:
    # \mathrm{cm\,s^{-1}} keeps the "s" on the baseline (the criterion that
    # chose mathjax-termes for the page), uppercase Greek stays upright, and
    # \sqrt renders -- XCharter-Math carries radical extensions that the text
    # face does not.
    mathfont: XCharter-Math
    toc: false          # moved to the back of the document — see the end of this file
    number-sections: true
    # The document's top heading level is "##", which LaTeX would number as
    # subsections (0.1, 0.2, ...). Promote by one so sections number 1, 2, 3.
    shift-heading-level-by: -1
    include-in-header:
      text: |
        % Running head so every printed sheet identifies itself in the bag.
        \usepackage{scrlayer-scrpage}
        \clearpairofpagestyles
        \KOMAoptions{headsepline=true}
        \setcounter{tocdepth}{3}
        \makeatletter
        \ihead{\normalfont\footnotesize\@subtitle}
        \ohead{\normalfont\footnotesize\@date}
        \makeatother
        \cfoot*{\normalfont\footnotesize\pagemark}
        \pagestyle{scrheadings}

        % Headings, mirroring the HTML: EB Garamond Bold for sections,
        % EB Garamond MediumItalic for subsections.
        %
        % This is NOT cosmetic drift. KOMA's default disposition font is SANS
        % (the old PDF set every heading in Latin Modern Sans Bold), which was
        % survivable beside Latin Modern body text and is not beside XCharter.
        % Moving the body without moving the headings would ship a serif/sans
        % clash against the settled serif + serif choice.
        %
        % shift-heading-level-by: -1 maps "##" -> \section and "###" ->
        % \subsection, so these are the same two levels the theme styles as h2
        % and h3 on the web.
        %
        % The families are declared with all four shapes pointing at real
        % files. KOMA applies \bfseries to dispositions, and a family whose
        % bold slot is undefined emits "Font shape ... /bx/n undefined" and
        % silently substitutes; mapping the subsection's bold slot back to the
        % Medium keeps \bfseries from over-weighting an intentionally medium
        % heading.
        %
        % Ligatures=TeX is NOT optional here. Pandoc's template scopes it to
        % \rmfamily only (\defaultfontfeatures[\rmfamily]{Ligatures=TeX}), and
        % a \newfontfamily does not inherit that. Pandoc also writes an em dash
        % into the LaTeX as "---", so without this the subtitle printed a
        % literal "ASTRO 206 --- Black Holes". Same mechanism would hit `` ''
        % and -- in any heading.
        \newfontfamily\ebgheading{EB Garamond}[
          Ligatures=TeX,
          UprightFont=*-Regular, BoldFont=*-Bold,
          ItalicFont=*-Italic,   BoldItalicFont=*-BoldItalic]
        \newfontfamily\ebgsubheading{EB Garamond}[
          Ligatures=TeX,
          UprightFont=*-Medium, BoldFont=*-Medium,
          ItalicFont=*-MediumItalic, BoldItalicFont=*-MediumItalic]
        % `disposition` is KOMA's PARENT element for every sectioning heading
        % AND the title block, so one line catches the title, the subtitle and
        % \subsubsection too. Scoping this to `section` alone left the title,
        % the subtitle and all ten back-TOC entries in Latin Modern Sans --
        % verified by reading the font off each run, not by looking at page 1.
        \addtokomafont{disposition}{\ebgheading}
        % Applied after `disposition`, so this wins for subsections only.
        \addtokomafont{subsection}{\ebgsubheading\itshape}

        % Callout icons in the PDF.
        %
        % Quarto draws them with FontAwesome 5, not Bootstrap Icons, and picks
        % the glyph by CALLOUT TYPE alone -- see filters/modules/callouts.lua,
        % which emits a bare \textcolor{...}{\faInfo}\hspace{0.5em}. A custom
        % class is never consulted, so roles inside a family share one glyph in
        % print; only the HTML distinguishes them. That is accepted for now.
        %
        % Because the macro is emitted bare, redefining it here is the whole
        % job -- no template override, and it survives a Quarto upgrade.
        % Loading the package first guarantees the targets exist (a \let to an
        % undefined macro would fail silently at use, not here).
        %
        % Safe in any order: no macro below is both a source and a target.
        %
        % The targets track the HTML marks as closely as FontAwesome allows.
        % HTML now draws typographic marks cut from XCharter and EB Garamond
        % (see marks.scss); print cannot, so these are the nearest vector
        % equivalents rather than the same artwork:
        %   note      \faInfo        -> \faParagraph       (Family 1, matches P)
        %   tip       \faLightbulb   -> \faQuestion        (Family 3, matches ?)
        %   important \faExclamation -> \faHandPointRight  (Family 5, matches
        %                                                   the manicule)
        %   warning   \faExclamationTriangle               (Family 4 -- FA5 Free
        %                                                   has no dagger, so
        %                                                   the triangle stands
        %                                                   in for the obelisk)
        %   caution   \faFire -> \faExclamationTriangle    (Family 4 absorbed
        %                                                   caution AND warning,
        %                                                   so both print alike)
        \usepackage{fontawesome5}
        \let\faInfo\faParagraph
        \let\faLightbulb\faQuestion
        \let\faExclamation\faHandPointRight
        \let\faFire\faExclamationTriangle
    number-depth: 2
    fig-align: center
    fig-width: 6.5
    fig-height: 4.0
    colorlinks: true
    echo: false
    # NO bibliography in the PDF. This is a deliberate asymmetry, not an
    # oversight: the PDF is the blackboard build, for Kayhan to lecture from,
    # and a reference list is student-facing apparatus that has no job at the
    # board. It follows the same logic that already drops the .aside sidenotes.
    #
    # This is belt-and-braces rather than the mechanism. The primary guard is
    # that each citation lives inside a `content-visible when-format="html"`
    # block, so the PDF never contains the citation either -- which is also
    # what keeps a bare "(Hughes 2024)" from printing with nothing to resolve
    # it against. This key catches any citation that later lands in shared
    # prose without that wrapper.
    suppress-bibliography: true
# Citations. Rendered by pandoc's citeproc, which ships INSIDE Quarto -- there
# is no external toolchain and CI installs nothing new for this. Both files are
# committed beside this one.
#
# Project-level, so every document inherits. Quarto puts the reference list at
# the END of each document, which is where Kayhan wants it: after the Summary,
# so the Summary stays the last word of the lecture proper and the references
# read as apparatus rather than content.
#
# Chicago author-date, NOT ApJ -- the reasoning is in references.bib and it is
# not the obvious choice for an astronomer. Short version: AAS style omits
# titles, which is correct for a journal and useless for a reading list of
# course notes and web pages.
# The `date:` on each lecture is the date the lecture is GIVEN, taken from the
# Canvas Reading & Reflection due dates and cross-checked against the In-Class
# Problem titles, which carry their date in the name. Quarto labels the date
# field "Published" by default, which is wrong here -- these pages are
# published whenever CI runs, not on the day the class meets. Override the
# language string rather than the date, so the label matches what the value
# actually means. Kayhan chose "Lecture date" on 2026-08-29.
#
# Reverting is this block alone; the dates themselves stay correct either way.
language:
  title-block-published: "Lecture date"

bibliography: references.bib
csl: chicago-author-date.csl
crossref:
  eq-prefix: "Eq."
# freeze is deliberately OFF. `freeze: auto` is incompatible with the in_class
# symlink swap: the freeze hash is computed from the .qmd, which never changes
# when the symlink flips, so a stale build is replayed silently in BOTH
# directions -- an instructor build loses the problems, and a student build
# keeps them (and _freeze/ then holds the answers in plain text).
execute:
  warning: false
  message: false
  freeze: false
